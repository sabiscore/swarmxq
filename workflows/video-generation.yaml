family: video
description: Pressure-aware video generation pipeline for SwarmXQ.
risk: medium

meta:
  model_triad:
    router: route-phi4-lite-q4km-prod
    reasoning: plan-qwen25-pro-q5km-prod
    execution: plan-qwen25-pro-q5km-prod

stages:
  - name: intent_classification
    owner: strategist
    model: instruct-phi4-pro-q8-prod
    risk: low
    purpose: Normalize the request, constraints, and target platform.
    outputs:
      - prompt
      - style
      - aspect
      - length
      - targetPlatform

  - name: planning
    owner: video-planner
    model: plan-qwen25-pro-q5km-prod
    risk: medium
    purpose: Decide the narrative structure, scene count, and pacing.
    outputs:
      - plan
      - intent
      - keyPoints

  - name: scripting
    owner: video-planner
    model: plan-qwen25-pro-q5km-prod
    risk: medium
    purpose: Produce the narration, hook, body, and call-to-action.
    outputs:
      - script

  - name: storyboard_generation
    owner: video-planner
    model: plan-qwen25-pro-q5km-prod
    risk: medium
    purpose: Convert the script into shots with visual direction.
    outputs:
      - storyboard
      - shotPrompts

  - name: render_assembly
    owner: renderer
    model: none
    risk: medium
    purpose: Dispatch or defer the final visual render depending on system pressure.
    outputs:
      - renderManifest
      - artifactPaths

  - name: finalizing
    owner: strategist
    model: none
    risk: low
    purpose: Persist outputs and publish completion metadata.
    outputs:
      - jobSummary
      - artifactIndex
