[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swarmx"
version = "2026.6.0"
description = "AGI-style autonomous swarm control plane with bounded self-evolution"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "SwarmX Contributors", email = "swarmx@example.com"}]

dependencies = [
  "PyYAML>=6.0.2",
  "rich>=13.7.1",
  "typer>=0.12.0",
  "textual>=0.61.0",
  "tqdm>=4.66.0",
  "pyfiglet>=1.0.2",
  "questionary>=2.0.1",
  "structlog>=24.1.0",
  "httpx>=0.27.0",
  "aiofiles>=24.1.0",
]

[project.optional-dependencies]
openai    = ["openai-agents>=0.0.9"]
langgraph = ["langgraph>=0.2.0"]
crewai    = ["crewai>=1.8.0"]
autogen   = ["autogen-agentchat>=0.4.0"]
adk       = ["google-adk>=0.3.0"]
strands   = ["strands-agents>=0.1.0"]
mcp       = ["mcp>=1.0.0"]
http      = ["httpx>=0.27.0"]
tts       = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "soundfile>=0.12.1",
  "numpy>=1.26.0",
  "kokoro>=0.9.0",
]
video = [
  "faster-whisper>=1.1.0",
  "modal>=1.5.0",
]
all = [
  "openai-agents>=0.0.9",
  "langgraph>=0.2.0",
  "crewai>=1.8.0",
  "autogen-agentchat>=0.4.0",
  "google-adk>=0.3.0",
  "strands-agents>=0.1.0",
  "mcp>=1.0.0",
  "httpx>=0.27.0",
]

dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.24.0",
  "pytest-timeout>=2.3.0",
  "ruff>=0.4.0",
  "mypy>=1.10.0",
]

[project.scripts]
swarm  = "swarmx.cli:main"
swarmx = "swarmx.cli:main"

[tool.pytest.ini_options]
testpaths        = ["tests"]
pythonpath       = [".", "src"]
addopts          = "-q --tb=short"
python_files     = "test_*.py"
python_functions = "test_*"
timeout = 120

[tool.setuptools]
include-package-data = true
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length    = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
  "E501",
  "E402",
  "E701",
  "B008",
  "B904",
  "B007",
  "E741",
  "SIM102",
  "SIM105",
  "SIM108",
  "SIM110",
  "UP006",
  "UP007",
  "UP042",
]

[tool.mypy]
python_version       = "3.11"
warn_return_any      = true
warn_unused_ignores  = false
ignore_missing_imports = true
no_site_packages = true

[[tool.mypy.overrides]]
module = [
  "numpy",
  "numpy.*",
]
follow_imports = "skip"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "core.*",
  "swarmx.audit",
  "swarmx.cli",
  "swarmx.config",
  "swarmx.console.*",
  "swarmx.core.*",
  "swarmx.evolution_layer.*",
  "swarmx.execution_gate",
  "swarmx.executor",
  "swarmx.evolver",
  "swarmx.llm",
  "swarmx.memory_graph",
  "swarmx.mission",
  "swarmx.narrative",
  "swarmx.runtime",
  "swarmx.telemetry",
  "swarmx.tooling",
  "swarmx.worker",
  "swarmx.workflows",
]
ignore_errors = true
