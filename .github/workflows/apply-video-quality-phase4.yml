name: Apply Video Quality Phase 4

on:
  push:
    branches:
      - feat/viral-video-engine-modal-phase2-3

permissions:
  contents: write

jobs:
  migrate:
    if: "!contains(github.event.head_commit.message, '[phase4-migrated]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/viral-video-engine-modal-phase2-3
          fetch-depth: 0
      - name: Apply quality integration
        run: python3 scripts/apply-video-quality-phase4.py
      - name: Validate diff
        run: git diff --check
      - name: Commit migrated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(video): complete quality and studio integration [phase4-migrated]"
          git push origin HEAD:feat/viral-video-engine-modal-phase2-3
