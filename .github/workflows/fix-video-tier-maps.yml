name: Fix Video Tier Maps

on:
  push:
    branches:
      - feat/viral-video-engine-modal-phase2-3

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[tiermaps-fixed]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/viral-video-engine-modal-phase2-3
          fetch-depth: 1
      - run: python3 scripts/fix-video-tier-maps.py
      - run: |
          rm -f scripts/fix-video-tier-maps.py .github/workflows/fix-video-tier-maps.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(video): complete renderer tier maps [tiermaps-fixed]"
          git push origin HEAD:feat/viral-video-engine-modal-phase2-3
