name: Apply Video Engine Phase 2

on:
  push:
    branches:
      - feat/viral-video-engine-modal-phase2-3

permissions:
  contents: write

jobs:
  migrate:
    if: "!contains(github.event.head_commit.message, '[phase2-migrated]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/viral-video-engine-modal-phase2-3
          fetch-depth: 0

      - name: Apply migration
        run: python3 scripts/apply-video-engine-phase2.py

      - name: Remove migration script and workflow
        run: |
          rm -f scripts/apply-video-engine-phase2.py
          rm -f .github/workflows/apply-video-engine-phase2.yml

      - name: Commit migrated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(video): migrate viral video engine render path [phase2-migrated]"
          git push origin HEAD:feat/viral-video-engine-modal-phase2-3
